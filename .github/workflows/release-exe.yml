name: Release SpecForge.exe

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-exe:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # 64-bit is required so per-core CPU samples cover all logical processors.
          python-version: "3.12"
          architecture: "x64"

      - name: Build SpecForge.exe
        shell: pwsh
        run: |
          $bits = python -c "import struct; print(struct.calcsize('P') * 8)"
          if ($bits -ne "64") { throw "Expected 64-bit Python, got ${bits}-bit" }
          python -m venv .venv
          .\.venv\Scripts\python -m pip install --upgrade pip
          .\.venv\Scripts\pip install -r requirements.txt
          $icon = Join-Path $PWD "assets\specforge.ico"
          $verinfo = Join-Path $PWD "assets\version_info.txt"
          .\.venv\Scripts\pyinstaller --noconfirm --clean --onefile --noconsole --name SpecForge --icon $icon --version-file $verinfo --add-data "assets\specforge.ico;assets" --add-data "assets\specforge.png;assets" --add-data "assets\specforge_32.png;assets" --add-data "assets\specforge_64.png;assets" --collect-all customtkinter main.py
          if (-not (Test-Path "dist\SpecForge.exe")) { throw "SpecForge.exe was not built" }
          .\.venv\Scripts\pip install pefile -q
          .\.venv\Scripts\python -c "import pefile; pe=pefile.PE('dist/SpecForge.exe'); types=[(e.name if e.name else __import__('pefile').RESOURCE_TYPE.get(e.id,e.id)) for e in pe.DIRECTORY_ENTRY_RESOURCE.entries]; assert any('ICON' in str(t).upper() or t in (3,14,'RT_ICON','RT_GROUP_ICON') for t in types), types; print('PE icon resources OK', types)"

      - name: Write release metadata
        shell: pwsh
        run: |
          $version = (Select-String -Path specforge_desktop\__init__.py -Pattern '__version__\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          $sha = (Get-FileHash -Algorithm SHA256 -Path dist\SpecForge.exe).Hash.ToLower()
          $meta = @{
            version = $version
            commit = "${{ github.sha }}"
            tag = "latest"
            repo = "${{ github.repository }}"
            sha256 = $sha
            built_at = (Get-Date).ToUniversalTime().ToString("o")
          } | ConvertTo-Json
          Set-Content -Path dist\version.json -Value $meta -Encoding utf8
          Set-Content -Path dist\.specforge_commit -Value "${{ github.sha }}" -Encoding utf8
          Write-Host "SpecForge.exe sha256=$sha"

      - name: Publish latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          target_commitish: ${{ github.sha }}
          name: SpecForge latest (auto)
          body: |
            Automatic Windows build from `main`.

            - Commit: `${{ github.sha }}`

            In SpecForge, open **Updates** → **Pull update** to download and replace `SpecForge.exe`.
          files: |
            dist/SpecForge.exe
            dist/version.json
          fail_on_unmatched_files: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
